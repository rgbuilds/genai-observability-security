[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genai-observability"
version = "0.1.0"
description = "Scaffold for a paired study of GenAI telemetry privacy and forensic utility."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genai_observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-q"]
